<div class="card chart-card">
  <div class="chart-header">
    <div>
      <h3>Subscription Analytics</h3>
      <p>Current Membership Distribution</p>
    </div>

    <div class="subscription-summary">
      <h2>{{ premium_users|default:"0" }}</h2>
      <span>Premium Members</span>
    </div>
  </div>

  <div id="subscriptionChart"></div>

  <div class="subscription-grid">
    <div class="subscription-box free">
      <h4>Free</h4>
      <h2>{{ free_users|default:"0" }}</h2>
      <span>Basic Plan</span>
    </div>

    <div class="subscription-box premium">
      <h4>Premium</h4>
      <h2>{{ premium_users|default:"0" }}</h2>
      <span>Paid Plan</span>
    </div>

    <div class="subscription-box vip">
      <h4>VIP</h4>
      <h2>{{ vip_users|default:"0" }}</h2>
      <span>Elite Plan</span>
    </div>
  </div>
</div>
